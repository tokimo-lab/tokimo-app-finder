[app]
id          = "finder"
display     = "Finder"
version     = "0.1.0"
description = "Tokimo 文件管理器 — 文件浏览、收藏夹管理"

[runtime]
lifecycle    = "resident"
binary       = "tokimo-app-finder"
ui_dist      = "ui/dist"

[ui]
entry        = "assets/index.js"
window_type  = "finder"
category     = "system"
icon         = "FolderOpen"
image        = "icon.png"
color        = "#3b82f6"
width        = 1100
height       = 700
full_bleed   = true

[cli]
name = "tokimo-app-finder"
description = "Manage VFS storage bucket files for the user: list/read/create/delete/move/copy, download, upload, and sync directories. Also manage file favorites."

[skills]
dir = "skills"

[database]
schema = "finder"
migrations_dir = "migrations"
driver = "postgres"

[[settings]]
id    = "sidebar"
title = "settings.sidebar.title"
icon  = "Sidebar"

[[settings.fields]]
key          = "sidebarCollapsed"
type         = "boolean"
label        = "settings.sidebar.defaultCollapsed"
defaultValue = false

[settings.fields.preferenceScope]
scope    = "component"
scope_id = "finder"

[[settings]]
id    = "view"
title = "settings.fileManager.view"
icon  = "FolderOpen"

[[settings.fields]]
key          = "viewMode"
type         = "select"
label        = "settings.fileManager.viewMode"
defaultValue = "list"
options      = [
  { label = "settings.fileManager.viewList", value = "list" },
  { label = "settings.fileManager.viewGrid", value = "grid" },
  { label = "settings.fileManager.viewColumn", value = "column" },
]

[settings.fields.preferenceScope]
scope    = "component"
scope_id = "file-manager"

[[settings.fields]]
key          = "sortBy"
type         = "select"
label        = "settings.fileManager.sortBy"
defaultValue = "name"
options      = [
  { label = "settings.fileManager.sortName", value = "name" },
  { label = "settings.fileManager.sortSize", value = "size" },
  { label = "settings.fileManager.sortModifiedAt", value = "modifiedAt" },
]

[settings.fields.preferenceScope]
scope    = "component"
scope_id = "file-manager"

[[settings.fields]]
key          = "sortDir"
type         = "select"
label        = "settings.fileManager.sortDir"
defaultValue = "asc"
options      = [
  { label = "settings.fileManager.sortAsc", value = "asc" },
  { label = "settings.fileManager.sortDesc", value = "desc" },
]

[settings.fields.preferenceScope]
scope    = "component"
scope_id = "file-manager"

[[settings.fields]]
key          = "showHidden"
type         = "boolean"
label        = "settings.fileManager.showHidden"
defaultValue = false

[settings.fields.preferenceScope]
scope    = "component"
scope_id = "file-manager"

[[app_settings]]
id                   = "file-previewer"
title                = "settings.filePreviewer.title"
icon                 = "Eye"
component_section_id = "file-previewer"

[[app_settings]]
id                   = "file-manager"
title                = "settings.fileManager.title"
icon                 = "FolderOpen"
component_section_id = "file-manager"
