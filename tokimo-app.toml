[app]
id          = "finder"
display     = "Finder"
version     = "0.1.0"
description = "Tokimo 文件管理器 — 文件浏览、收藏夹管理"

[runtime]
lifecycle    = "resident"
binary       = "tokimo-app-finder"
ui_dist      = "ui/dist"

[ui]
entry        = "assets/index.js"
window_type  = "finder"
category     = "system"
icon         = "FolderOpen"
image        = "icon.png"
color        = "#3b82f6"
width        = 1100
height       = 700
full_bleed   = true

[cli]
name = "tokimo-app-finder"
description = "Manage VFS storage bucket files for the user: list/read/create/delete/move/copy, download, upload, and sync directories. Also manage file favorites."

[database]
schema = "finder"
migrations_dir = "migrations"
driver = "postgres"

[[app_settings]]
id                   = "file-previewer"
title                = "settings.filePreviewer.title"
icon                 = "Eye"
component_section_id = "file-previewer"

[[app_settings]]
id                   = "file-manager"
title                = "settings.fileManager.title"
icon                 = "FolderOpen"
component_section_id = "file-manager"
